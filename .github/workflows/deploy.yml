name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    permissions:
      contents: read
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up site dependencies
        uses: ./.github/actions/setup-site

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('site/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: npm run test:install

      - name: Type and Astro check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Run regression tests
        run: npm test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-deploy
          path: site/playwright-report/
          retention-days: 7

      - name: Package Pages artifact
        run: |
          tar \
            --dereference --hard-dereference \
            --directory dist \
            -cvf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git \
            --exclude=.github \
            --exclude=".[^/]*" \
            .

      - name: Upload Pages artifact
        # GitHub's upload-pages-artifact wrapper still pins an upload-artifact
        # release that triggers the runner's Node 20 deprecation warning.
        uses: actions/upload-artifact@v6
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        # `actions/deploy-pages@v4` still emits a Node 20 deprecation warning,
        # so call the Pages deployment API directly from Node 24.
        uses: actions/github-script@v8
        with:
          retries: 3
          script: |
            const artifactName = 'github-pages'
            const reportingIntervalMs = 5000
            const timeoutMs = 600000
            const owner = context.repo.owner
            const repo = context.repo.repo
            const runId = context.runId
            const buildVersion = process.env.GITHUB_SHA

            const artifactsResponse = await github.rest.actions.listWorkflowRunArtifacts({
              owner,
              repo,
              run_id: runId,
              per_page: 100
            })

            const artifact = artifactsResponse.data.artifacts.find(({name}) => name === artifactName)

            if (!artifact) {
              throw new Error(`No artifact named "${artifactName}" was found for workflow run ${runId}.`)
            }

            const idToken = await core.getIDToken()
            const deploymentResponse = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              owner,
              repo,
              artifact_id: artifact.id,
              pages_build_version: buildVersion,
              oidc_token: idToken
            })

            const pageUrl = deploymentResponse.data.page_url || ''
            if (pageUrl) {
              core.setOutput('page_url', pageUrl)
            }

            const deploymentId =
              deploymentResponse.data.id ||
              deploymentResponse.data.status_url?.split('/').pop() ||
              buildVersion

            const finalErrorStatus = {
              deployment_failed: 'Deployment failed, try again later.',
              deployment_content_failed:
                'Artifact could not be deployed. Please ensure the content does not contain hard links or symlinks and stays under the Pages size limits.',
              deployment_cancelled: 'Deployment cancelled.',
              deployment_lost: 'Deployment failed to report final status.'
            }

            const temporaryStatusMessage = {
              unknown_status: 'Unable to get deployment status yet. Waiting for the next poll.',
              not_found: 'Deployment status is not ready yet. Waiting for the next poll.',
              deployment_attempt_error: 'Deployment temporarily failed. Waiting for the automatic retry.'
            }

            const deadline = Date.now() + timeoutMs

            while (Date.now() < deadline) {
              const statusResponse = await github.request(
                'GET /repos/{owner}/{repo}/pages/deployments/{deploymentId}',
                {
                  owner,
                  repo,
                  deploymentId
                }
              )

              const status = statusResponse.data.status

              if (status === 'succeed') {
                core.info('Reported success!')
                return pageUrl
              }

              if (status in finalErrorStatus) {
                throw new Error(finalErrorStatus[status])
              }

              core.info(temporaryStatusMessage[status] || `Deployment status: ${status}`)
              await new Promise((resolve) => setTimeout(resolve, reportingIntervalMs))
            }

            throw new Error('Timeout reached while waiting for the GitHub Pages deployment to complete.')
