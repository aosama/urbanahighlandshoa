name: "Copilot Setup Steps"

# This workflow customizes GitHub Copilot coding agent's ephemeral environment.
# It is separate from GitHub Agentic Workflows invoked through `gh aw`.

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up site dependencies
        uses: ./.github/actions/setup-site
